[package]
name = "bondsymphonic-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "bondsymphonic-ide"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
bondsymphonic-proto = { path = "../proto" }
cxx = "1"
cxx-qt = "0.10"
# Default features only: `qt_full` would pull in QtQml and QtQuickControls2,
# and BondSymphonic is Qt Widgets only.
cxx-qt-lib = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
directories = "5"
thiserror.workspace = true
alacritty_terminal = "0.26"
base64 = "0.22"
# No `unicode_lines`: QTextDocument starts a block only on a newline, so the
# rope must not count a form feed, vertical tab or NEL as one. LF and CRLF are
# recognised without any feature; `cr_lines` would add a bare CR, which Qt does
# not treat as a break either.
ropey = { version = "1", default-features = false, features = ["simd"] }
similar = "2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"

[build-dependencies]
cxx-qt-build = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
